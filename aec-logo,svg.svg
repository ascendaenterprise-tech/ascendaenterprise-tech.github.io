<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" role="img">
<title>Ascenda Enterprise Capital</title>
<desc>AEC institutional logo — bold black on white, 5-diamond mark matching reference wall pattern</desc>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&amp;display=swap');
  .wordmark { font-family: 'Inter', sans-serif; font-weight: 800; letter-spacing: 0.10em; fill: #000000; }
  .sub { font-family: 'Inter', sans-serif; font-weight: 600; letter-spacing: 0.28em; fill: #555555; }
</style>

<rect x="0" y="0" width="680" height="320" fill="#ffffff"/>

<!-- Nested diamond mark — 5 diamonds, matching reference wall pattern -->
<g transform="translate(168, 158)" fill="none" stroke="#000000" stroke-linejoin="miter">
  <polygon points="0,-64 64,0 0,64 -64,0" stroke-width="7"/>
  <polygon points="0,-50 50,0 0,50 -50,0" stroke-width="6"/>
  <polygon points="0,-36 36,0 0,36 -36,0" stroke-width="5.5"/>
  <polygon points="0,-22 22,0 0,22 -22,0" stroke-width="5"/>
  <polygon points="0,-9 9,0 0,9 -9,0" stroke-width="4.5"/>

  <g transform="translate(-16, 92)" stroke="none">
    <rect x="0"  y="0"   width="4" height="13" fill="#000000"/>
    <rect x="7"  y="-5"  width="4" height="18" fill="#000000" opacity="0.85"/>
    <rect x="14" y="-11" width="4" height="24" fill="#000000" opacity="0.65"/>
    <rect x="21" y="-16" width="4" height="29" fill="#000000" opacity="0.45"/>
    <rect x="28" y="-21" width="4" height="34" fill="#000000" opacity="0.25"/>
  </g>
</g>

<line x1="248" y1="88" x2="248" y2="228" stroke="#000000" stroke-width="1.5" opacity="0.9"/>

<text x="252" y="152" font-size="34" class="wordmark">ASCENDA</text>
<rect x="253" y="164" width="220" height="4" fill="#000000"/>
<text x="252" y="192" font-size="11" class="sub">ENTERPRISE  CAPITAL</text>

<text x="252" y="222" font-size="9" class="sub" style="letter-spacing:0.22em;fill:#666">GLOBAL MARKETS · PRIVATE EQUITY · REAL ESTATE</text>

<line x1="60" y1="272" x2="620" y2="272" stroke="#000000" stroke-width="1.2" opacity="0.9"/>

<text x="340" y="294" font-size="8.5" text-anchor="middle" class="sub" style="letter-spacing:0.24em;fill:#555">ASCENDA ENTERPRISE CAPITAL LLC  ·  ascendaenterprisecapital.com</text>

</svg>
