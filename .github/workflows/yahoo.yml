name: Refresh Yahoo Finance quotes
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: yahoo-quotes
  cancel-in-progress: true
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/pull_yahoo.py
      - name: Commit if changed
        run: |
          git config user.name "aec-yahoo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add yahoo_quotes.json
          [ -f quotes.json ] && git add quotes.json || true
          git diff --cached --quiet || (git commit -m "Update Yahoo quotes" && git push)
